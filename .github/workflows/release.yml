name: Release

# Builds AI Balance for Windows, Linux, macOS, Android and iOS.
#
#   - Push a tag like v1.2.3      -> builds everything and publishes a GitHub Release.
#   - Change .release-version     -> the same, for the version written in that file. The workflow
#                                    creates the tag itself.
#   - Run it by hand (Actions tab) -> builds everything; publishes only when "publish" is ticked.
#
# The version always comes from the tag (or the "version" input), so there is nothing to edit first.

on:
  push:
    tags: ["v*"]
    paths: [".release-version"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 0.1.0"
        required: true
      publish:
        description: "Publish a GitHub Release (otherwise the builds are only attached to this run)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$(tr -d '[:space:]' < .release-version)"
            version="${version#v}"
            publish=true
          else
            version="${INPUT_VERSION#v}"
            publish="$INPUT_PUBLISH"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install and set the version
        run: |
          npm ci
          node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Build
        shell: bash
        run: |
          args="${{ matrix.args }}"
          # RPM does not accept a version with a pre-release suffix such as 1.2.3-beta.1.
          case "${{ needs.prepare.outputs.version }}" in *-*) args="${args/deb,rpm,appimage/deb,appimage}" ;; esac
          npx tauri build $args

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find "${{ matrix.bundle }}" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' file; do
              # "AI Balance_1.2.3_x64.dmg" becomes "AIBalance_1.2.3_x64.dmg": no spaces in download names.
              name="$(basename "$file")"
              cp "$file" "out/${name// /}"
            done
          ls -l out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@v4
        with:
          name: aibalance-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Point the build at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install and set the version
        run: |
          npm ci
          node scripts/set-version.mjs "$VERSION"

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon assets/icon.png

      - name: Build the APK
        run: npx tauri android build --apk --aab --target aarch64 armv7

      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$unsigned"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            alias="${ANDROID_KEY_ALIAS:-aibalance}"
            password="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. Signing with a throwaway key: this APK installs, but it cannot update an earlier install. See the README."
            alias=aibalance
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype JKS -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$password" -keypass "$password" \
              -dname "CN=AI Balance test build"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p out
          "$tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$alias" \
            --ks-pass "pass:$password" --key-pass "pass:$password" \
            --out "out/AIBalance_${VERSION}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "out/AIBalance_${VERSION}_android.apk"
          # Google Play takes an app bundle signed with your upload key, so it is only made with a real keystore.
          bundle="$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$bundle" ]; then
            cp "$bundle" "out/AIBalance_${VERSION}_android.aab"
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$password" -keypass "$password" \
              -sigalg SHA256withRSA -digestalg SHA-256 "out/AIBalance_${VERSION}_android.aab" "$alias"
          fi
          rm -f "$RUNNER_TEMP/release.jks" out/*.idsig

      - uses: actions/upload-artifact@v4
        with:
          name: aibalance-Android
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error

  ios:
    name: iOS
    needs: prepare
    runs-on: macos-latest
    # An iPhone build needs an Apple Developer account. Without its secrets this job reports that and
    # tries an unsigned build for sideloading; it never blocks the release of the other platforms.
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios

      - name: Install and set the version
        run: |
          npm ci
          node scripts/set-version.mjs "$VERSION"

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          npx tauri ios init --ci
          npx tauri icon assets/icon.png

      - name: Build a signed IPA
        if: env.APPLE_API_KEY_BASE64 != '' && env.APPLE_DEVELOPMENT_TEAM != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY}.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${APPLE_API_KEY}.p8"
          npx tauri ios build --export-method app-store-connect
          mkdir -p out
          find src-tauri/gen/apple/build -name '*.ipa' -exec cp {} "out/AIBalance_${VERSION}_ios.ipa" \;
          rm -rf "$RUNNER_TEMP/keys"

      - name: Build an unsigned IPA (for sideloading)
        if: env.APPLE_API_KEY_BASE64 == '' || env.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          echo "::warning::No Apple signing secrets. Building an unsigned IPA, which installs only through a sideloading tool that signs it with your Apple ID. See the README."
          cd src-tauri/gen/apple
          # Turn code signing off for every target, then let Xcode archive the app.
          ruby -ryaml -e '
            project = YAML.load_file("project.yml")
            base = ((project["settings"] ||= {})["base"] ||= {})
            base.merge!("CODE_SIGNING_ALLOWED" => "NO", "CODE_SIGNING_REQUIRED" => "NO", "CODE_SIGN_IDENTITY" => "")
            File.write("project.yml", project.to_yaml)
          '
          xcodegen generate
          cd "$GITHUB_WORKSPACE"
          # The archive step produces the app; the export step needs a signature and is expected to fail.
          npx tauri ios build || true
          app="$(find src-tauri/gen/apple -path '*.xcarchive/Products/Applications/*.app' -maxdepth 6 -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::Xcode produced no app to package."
            exit 1
          fi
          mkdir -p out Payload
          cp -R "$app" Payload/
          zip -qry "out/AIBalance_${VERSION}_ios_unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: aibalance-iOS
          path: out/*.ipa
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, desktop, android, ios]
    if: needs.prepare.outputs.publish == 'true' && needs.desktop.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: aibalance-*
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -l artifacts
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AI Balance $VERSION" \
            --generate-notes \
            "${flags[@]}"
