name: CI

on:
  push:
    # A Dependabot branch is checked once, by its pull request.
    branches-ignore: ["dependabot/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        timeout-minutes: 15
        run: |
          # The runner's default Azure mirror can be unreachable, and apt then waits on every package.
          # Use Ubuntu's own archive instead.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          # The archive is sometimes mid-update and misses a package for a minute; refresh and try again.
          for attempt in 1 2 3 4; do
            if sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=3 update &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=3 install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf; then
              exit 0
            fi
            echo "Attempt $attempt failed; waiting before the next one."
            sleep 45
          done
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the web UI
        run: |
          npm ci
          npm run build

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
